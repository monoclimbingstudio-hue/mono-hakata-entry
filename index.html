<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENTRY LIST ｜ Mono Bouldering Competition IN HAKATA R-18 Vol.2 2026</title>
<meta name="description" content="Mono Climbing Studio 博多店 ボルダリングコンペ エントリーリスト（公開用）">
<meta property="og:title" content="ENTRY LIST ｜ Mono Bouldering Competition IN HAKATA R-18 Vol.2">
<meta property="og:description" content="博多店コンペのエントリーリスト。エントリー状況はリアルタイムで更新されます。">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #16140f; --paper: #f4f1ea; --card: #fffdf8; --line: #e6e1d5; --line2: #c9c2b2;
  --muted: #5b554a; --muted2: #8a8375; --amber: #e0962e; --amber2: #b8701d; --amber-tint: #fbeed7; --zone-tint: #ebe6da;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Noto Sans JP', 'Hiragino Sans', sans-serif; -webkit-text-size-adjust: 100%; }
.num { font-family: 'Bebas Neue', 'Oswald', 'Arial Narrow', sans-serif; letter-spacing: 0.04em; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; height: 60px; background: var(--ink); color: var(--paper); position: sticky; top: 0; z-index: 5; }
.topbar .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.topbar img { height: 32px; width: auto; display: block; }
.topbar .label { font-size: 20px; line-height: 1; white-space: nowrap; border-left: 1px solid rgba(244,241,234,0.3); padding-left: 12px; }
.live { display: flex; align-items: center; gap: 7px; font-size: 11px; letter-spacing: 0.08em; white-space: nowrap; opacity: 0.9; }
.live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); box-shadow: 0 0 0 4px rgba(224,150,46,0.25); animation: pulse 2s infinite; }
.live.offline .dot { background: #999; box-shadow: none; animation: none; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 3px rgba(224,150,46,0.25);} 50% { box-shadow: 0 0 0 6px rgba(224,150,46,0.08);} }

.hero { background: var(--ink); color: var(--paper); padding: 22px 16px 26px; border-top: 1px solid rgba(244,241,234,0.08); }
.hero .inner { max-width: 960px; margin: 0 auto; }
.hero .kicker { font-size: 12px; letter-spacing: 0.22em; color: var(--amber); }
.hero h1 { margin: 6px 0 0; font-size: clamp(30px, 7vw, 52px); line-height: 0.98; font-weight: 400; }
.hero h1 .sub { display: block; font-size: 0.55em; opacity: 0.85; margin-top: 4px; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.stat { background: rgba(244,241,234,0.06); border: 1px solid rgba(244,241,234,0.14); border-radius: 6px; padding: 10px 14px; min-width: 120px; }
.stat .v { font-size: 34px; line-height: 1; color: var(--amber); }
.stat .k { font-size: 11px; letter-spacing: 0.1em; opacity: 0.75; margin-top: 4px; }

.wrap { max-width: 960px; margin: 0 auto; padding: 14px 16px 40px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 14px; }
.chip { font-size: 13px; font-weight: 500; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line2); color: var(--muted); background: transparent; cursor: pointer; white-space: nowrap; font-family: inherit; }
.chip.active { background: var(--amber); border-color: var(--amber); color: var(--ink); font-weight: 700; }
.chip .c { font-family: 'Bebas Neue', sans-serif; font-size: 14px; margin-left: 5px; opacity: 0.8; }

.cat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
.cat .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 14px 10px; border-bottom: 2px solid var(--ink); }
.cat .head .name { font-size: 28px; line-height: 1; }
.cat .head .name .grade { font-family: 'Noto Sans JP', sans-serif; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 8px; white-space: nowrap; }
.cat .head .name .grade:empty { display: none; }
.cat .head .cnt { font-size: 22px; line-height: 1; color: var(--amber2); white-space: nowrap; }
.cat .head .cnt small { font-family: 'Noto Sans JP', sans-serif; font-size: 11px; color: var(--muted); margin-left: 3px; }
.cat ul { list-style: none; margin: 0; padding: 4px 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.cat li { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px dashed var(--line); font-size: 16px; font-weight: 500; min-width: 0; }
.cat li .no { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--muted2); width: 26px; text-align: right; flex: none; }
.cat li .nm { overflow-wrap: anywhere; }
.cat .empty { padding: 14px; font-size: 13px; color: var(--muted2); }

.note { font-size: 12px; color: var(--muted); line-height: 1.7; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line2); }
.note .upd { color: var(--muted2); }
.foot { text-align: center; font-size: 11px; color: var(--muted2); margin-top: 26px; letter-spacing: 0.06em; }
.msg { padding: 30px 14px; text-align: center; color: var(--muted); font-size: 14px; }
.msg.err { color: #a33; }
.btn { font-family: inherit; font-size: 13px; padding: 8px 16px; border-radius: 4px; border: 1.5px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <img src="./mono-logo-white.png" alt="Mono Climbing Studio">
    <div class="num label">ENTRY LIST</div>
  </div>
  <div class="live offline" id="live"><span class="dot"></span><span class="txt">読み込み中…</span></div>
</div>

<div class="hero">
  <div class="inner">
    <div class="num kicker">MONO CLIMBING STUDIO HAKATA</div>
    <h1 class="num">Mono Bouldering Competition<span class="sub">IN HAKATA R-18 Vol.2 ／ 2026</span></h1>
    <div class="stats">
      <div class="stat"><div class="num v" id="total">–</div><div class="num k">TOTAL ENTRIES</div></div>
      <div class="stat"><div class="num v" id="catCount">–</div><div class="num k">CATEGORIES</div></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="chips" id="chips"></div>
  <div id="list"><div class="msg">エントリーリストを読み込んでいます…</div></div>
  <div class="note">
    ・表示はエントリー名のみです。エントリー順（受付順）に並んでいます。<br>
    ・エントリー内容の変更・キャンセルは博多店までご連絡ください。<br>
    ・フォーム送信後、リストへの反映には数分かかる場合があります。<br>
    <span class="upd" id="upd"></span>
  </div>
  <div class="foot">© Mono Climbing Studio</div>
</div>

<script src="./config.js"></script>
<script>
// ===== 設定 =====
// Googleスプレッドシート「公開用」シートを「ウェブに公開（CSV）」したURL
const CSV_URL = (window.ENTRY_CONFIG && window.ENTRY_CONFIG.csvUrl) || '';
const REFRESH_MS = 60 * 1000; // 自動更新間隔

// カテゴリー表示順（値が小さいほど上）。該当しない名前は末尾に出現順で並ぶ
// 並び：U-8 → U-10 → U-12 → BEGINNER → ENTRY → MIDDLE → UPPER MIDDLE → MASTER系 → EXPERT ADVANCED → EXPERT系 → OPEN
// 同じグループ内は 一般 → WOMEN'S → OVER40 の順
function catRank(name) {
  const n = name.toUpperCase().replace(/[’‘'`]/g, "'");
  let r = 500;
  if (/U-?\s?8\b|U8\b/.test(n)) r = 10;
  else if (/U-?\s?10\b|U10\b/.test(n)) r = 20;
  else if (/U-?\s?12\b|U12\b/.test(n)) r = 30;
  else if (/BEGINNER|ビギナー/.test(n)) r = 100;
  else if (/ENTRY|エントリー/.test(n)) r = 150;
  else if (/UPPER\s*MIDDLE|アッパーミドル/.test(n)) r = 220;
  else if (/MIDDLE|ミドル/.test(n)) r = 200;
  else if (/MASTER|マスター/.test(n)) r = 300;
  else if (/EXPERT\s*ADVANCED/.test(n)) return 390;
  else if (/EXPERT|エキスパート/.test(n)) r = 400;
  else if (/OPEN|オープン/.test(n)) r = 600;
  else if (/OVER\s*40/.test(n)) r = 330;
  if (r >= 150 && r < 600 && /OVER\s*40/.test(n)) r += 30;
  if (/WOMEN|WOMAN|LADIES|女子/.test(n)) r += 5;
  return r;
}

// ===== CSVパース（引用符・改行対応） =====
function parseCSV(text) {
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c === '\r') { /* skip */ }
    else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let activeCat = 'ALL';
let cache = null;

function setLive(ok, text) {
  const el = $('#live'); el.classList.toggle('offline', !ok); el.querySelector('.txt').textContent = text;
}

async function load() {
  if (!CSV_URL) { $('#list').innerHTML = '<div class="msg">エントリーリストは準備中です。しばらくお待ちください。</div>'; setLive(false, '準備中'); return; }
  try {
    const url = CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + '_=' + Date.now();
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text).filter(r => r.some(v => v && v.trim() !== ''));
    // 1行目はヘッダー（エントリー名, カテゴリー）
    const clean = (v) => String(v || '').replace(/[\u200B-\u200F\u202A-\u202E\u2066-\u2069\uFEFF]/g, '').trim();
    const body = rows.slice(1).map(r => ({ name: clean(r[0]), cat: clean(r[1]) }))
      .filter(e => e.cat !== '' || e.name !== '');
    cache = body;
    render(body);
    setLive(true, 'LIVE');
    $('#upd').textContent = '最終更新 ' + new Date().toLocaleString('ja-JP', { hour12: false });
  } catch (e) {
    console.error(e);
    setLive(false, '更新エラー');
    if (!cache) $('#list').innerHTML = '<div class="msg err">エントリーリストを読み込めませんでした。<br>通信状況をご確認のうえ、再読み込みしてください。<br><br><button class="btn" onclick="location.reload()">再読み込み</button></div>';
  }
}

function render(entries) {
  // カテゴリー集計（出現順を保持してから表示順でソート）
  const order = []; const map = new Map();
  entries.forEach(e => {
    const c = e.cat || '（カテゴリー未設定）';
    if (!map.has(c)) { map.set(c, []); order.push(c); }
    map.get(c).push(e.name || '（エントリー名未記入）');
  });
  const cats = order.map((c, i) => ({ name: c, rank: catRank(c), idx: i, list: map.get(c) }))
    .sort((a, b) => a.rank - b.rank || a.idx - b.idx);

  $('#total').textContent = entries.length;
  $('#catCount').textContent = cats.length;

  // チップ
  const chips = [`<button class="chip ${activeCat === 'ALL' ? 'active' : ''}" data-cat="ALL">すべて<span class="c">${entries.length}</span></button>`]
    .concat(cats.map(c => `<button class="chip ${activeCat === c.name ? 'active' : ''}" data-cat="${esc(c.name)}">${esc(shortName(c.name))}<span class="c">${c.list.length}</span></button>`));
  $('#chips').innerHTML = chips.join('');
  $('#chips').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { activeCat = b.dataset.cat; render(cache); }));

  if (!entries.length) { $('#list').innerHTML = '<div class="msg">まだエントリーはありません。</div>'; return; }

  const shown = activeCat === 'ALL' ? cats : cats.filter(c => c.name === activeCat);
  $('#list').innerHTML = shown.map(c => `
    <section class="cat">
      <div class="head"><div class="num name">${esc(shortName(c.name))}<span class="grade">${esc(gradeOf(c.name))}</span></div><div class="num cnt">${c.list.length}<small>名</small></div></div>
      <ul>${c.list.map((n, i) => `<li><span class="no">${i + 1}</span><span class="nm">${esc(n)}</span></li>`).join('')}</ul>
    </section>`).join('');
}

// チップ用の短縮名（括弧内のグレード表記を落とす）
function shortName(n) { return n.replace(/[（(][^）)]*[）)]/g, '').trim() || n; }
// 括弧内のグレード表記だけを取り出す（例: "MASTER（3Q～2Q）" → "3Q～2Q"）
function gradeOf(n) { const m = n.match(/[（(]([^）)]*)[）)]/); return m ? m[1].trim() : ''; }

load();
setInterval(load, REFRESH_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
</script>
</body>
</html>
